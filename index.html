<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code game </title>

    <!-- 
      ==================================================
      HVORDAN ENDRE FARGER (CSS):
      Inne i <style>-taggen under kan du bestemme farger.
      ==================================================
    -->
    <style>
        body {
            /* background-color: Endrer bakgrunnsfargen på hele siden. 
               Du kan skrive f.eks. 'lightblue', '#ff0000' (rød) eller fargekoder. */
            background-color: #f4f4f9;

            /* color: Endrer standard tekstfarge på hele siden. */
            color: #333333;

            /* font-family: Endrer skrifttypen. Prøv f.eks. 'Courier New', 'Georgia' osv. */
            font-family: Arial, sans-serif;

            /* Lager litt luft rundt kanten av skjermen */
            margin: 40px;
        }

        h1 {
            /* color: Du kan gi overskriften en egen farge her */
            color: #0056b3;
        }

        p {
            /* font-size: Endrer størrelsen på teksten (f.eks. 18px eller 1.2rem) */
            font-size: 16px;
            
            /* line-height: Bestemmer avstanden mellom linjene for enklere lesing */
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- 
      ==================================================
      HVORDAN ENDRE TEKST (HTML):
      - Overskriften ligger mellom <h1> og </h1>.
      - Vanlig avsnittstekst ligger mellom <p> og </p>.
      ==================================================
    -->

    <h1>Welcome to my code game!</h1>

    <p>Dette er et enkelt avsnitt med tekst. Du kan endre denne teksten ved å skrive det du vil ha her i koden, lagre filen, og oppdatere nettleseren.</p>

    <p>Her er et ekstra avsnitt. Hvis du vil ha ny linje eller et nytt avsnitt med tekst, lager du bare en ny <code>&lt;p&gt;</code>-tagg.</p>

</body>
</html>
