<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аниме Мини-Игра на Python</title>
    <!-- Подключаем Brython, чтобы Python работал в браузере -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
    <style>
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
            margin-bottom: 5px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #161622;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.2);
            border: 1px solid #2a2a3d;
        }
        .characters {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .char-card {
            text-align: center;
        }
        .char-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
        .char-card span {
            display: block;
            margin-top: 8px;
            font-weight: bold;
            color: #ff99bb;
        }
        #console-output {
            background: #09090e;
            color: #00ffcc;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #222233;
            white-space: pre-wrap;
            text-align: left;
            margin-bottom: 15px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #33334d;
            background: #0f0f17;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff1a53;
        }
    </style>
</head>
<body onload="brython()">

    <h1>Угадай число с Микасой и Ризе</h1>
    
    <div class="container">
        <!-- Блок с картинками персонажей -->
        <div class="characters">
            <div class="char-card">
                <img src="mikasa.jpg" alt="Микаса">
                <span>Микаса Аккерман</span>
            </div>
            div class="char-card">
                <img src="rize.jpg" alt="Ризе">
                <span>Ризе Камисиро</span>
            </div>
        </div>

        <!-- Консоль для вывода Python -->
        <div id="console-output">Загрузка игры на Python...</div>

        <!-- Поле ввода для игрока -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Введите ответ здесь...">
            <button id="send-btn" onclick="check_input()">Отправить</button>
        </div>
    </div>

    <!-- Сам твой Python-код, адаптированный под браузер -->
    <script type="text/python">
        import random
        from browser import document, window

        output = document["console-output"]
        input_box = document["user-input"]
        
        # Переменные состояния игры
        game_state = "get_name"
        name = ""
        best_score = None
        attempts = 1
        max_attempts = 5
        max_num = 10
        secretnumber = 0

        def print_log(text):
            output.text += text + "\n"
            output.scrollTop = output.scrollHeight # автопрокрутка вниз

        # Начальный вывод
        output.text = "what is your steam nickname?\n"

        def check_input(*args):
            global game_state, name, best_score, attempts, max_attempts, max_num, secretnumber
            
            val = input_box.value
            input_box.value = "" # очищаем поле ввода
            
            if game_state == "get_name":
                name = val
                print_log(val)
                print_log(f"\nHello, very nice nickname: {name}!")
                print_log("\nYou need to choose difficulty (0 = easy [1-10], 1 = medium [1-20], 2 = hard [1-50]):")
                game_state = "choose_level"
                
            elif game_state == "choose_level":
                try:
                    choice = int(val)
                    levels = [10, 20, 50]
                    max_num = levels[choice]
                    secretnumber = random.randint(1, max_num)
                    attempts = 1
                    print_log(f"Вы выбрали уровень. Guess the number from 1 to {max_num}: ")
                    game_state = "playing"
                except:
                    print_log("Пожалуйста, введите цифру 0, 1 или 2!")
                    
            elif game_state == "playing":
                try:
                    guess = int(val)
                    print_log(str(guess))
                    
                    if guess == secretnumber:
                        print_log(f"Lucky man! You guessed it in {attempts} attempts!")
                        if best_score is None or attempts < best_score:
                            best_score = attempts
                            print_log("New record!")
                        else:
                            print_log(f"Best score for now: {best_score} attempts.")
                        print_log("\nYou wanna play one more time? (y/n): ")
                        game_state = "ask_restart"
                    else:
                        if attempts >= max_attempts:
                            print_log(f"GAME OVER! YOU RUN OUT OF ATTEMPTS. The number was {secretnumber}.")
                            print_log("\nYou wanna play one more time? (y/n): ")
                            game_state = "ask_restart"
                        else:
                            if guess < secretnumber:
                                print_log("Too low! Try higher.")
                            else:
                                print_log("Too high! Try lower.")
                            attempts += 1
                            print_log("Wrong number, try again!")
                except:
                    print_log("Введите число!")
                    
            elif game_state == "ask_restart":
                print_log(val)
                if val.lower() == "y":
                    print_log("\nYou need to choose difficulty (0 = easy, 1 = medium, 2 = hard): ")
                    game_state = "choose_level"
                else:
                    print_log("Спасибо за игру! Закройте вкладку или перезагрузите страницу.")
                    game_state = "finished"

        # Поддержка нажатия Enter
        def on_key_down(event):
            if event.key == "Enter":
                check_input()
                
        input_box.bind("keydown", on_key_down)
    </script>

</body>
</html>
